# Telegram entry + exit alerts for VWAP 2-Band Reversion on BTC / ETH / SOL / XRP, 1H (alerts/vwap_alerts.js).
# Scans every minute for ~5h40m, then starts the next run itself (same chain as vol-alerts); hourly cron = backup.
# Open positions and the alert results live on the `vwap-state` branch.
# Telegram: own bot, secrets VWAP_BOT_TOKEN + VWAP_CHAT_ID. Until they are set it does one dry scan an hour and sends nothing.
# Monday run sends the status overview. To stop: Actions > this workflow > Disable.
name: VWAP alerts (Telegram)

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      test:
        description: 'Send a test message + the status now'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write   # lets each run start the next one

concurrency:
  group: vwap-alerts
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: alerts

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Load state
        run: |
          git fetch -q --depth 1 origin vwap-state && git show FETCH_HEAD:vwap_alerts_state.json > alerts/vwap_alerts_state.json || echo '{}' > alerts/vwap_alerts_state.json

      - name: Scan and alert
        id: scan
        working-directory: alerts
        env:
          VWAP_BOT_TOKEN: ${{ secrets.VWAP_BOT_TOKEN }}
          VWAP_CHAT_ID: ${{ secrets.VWAP_CHAT_ID }}
        run: |
          if [ -z "$VWAP_BOT_TOKEN" ] || [ -z "$VWAP_CHAT_ID" ]; then echo "::warning::VWAP Telegram secrets not set yet - dry run only"; node vwap_alerts.js --dry; exit 0; fi
          if [ "${{ inputs.test }}" = "true" ]; then node vwap_alerts.js --test; node vwap_alerts.js --status; exit 0; fi
          echo "live=true" >> "$GITHUB_OUTPUT"
          # Monday: one overview per week (first run that starts between 06:00 and 11:59 UTC)
          if [ "$(date -u +%u)" = "1" ] && [ "$(date -u +%H)" -ge 6 ] && [ "$(date -u +%H)" -lt 12 ] && \
             [ "$(node -e 'try{const s=require("./vwap_alerts_state.json");console.log(Date.now()-(s.lastStatus||0)>86400e3?1:0)}catch(e){console.log(1)}')" = "1" ]; then
            node vwap_alerts.js --status
          fi
          node vwap_alerts.js --loop 340

      - name: Save state
        if: always() && steps.scan.outputs.live == 'true'
        run: |
          [ -s alerts/vwap_alerts_state.json ] || exit 0
          git init -q pub && cd pub
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git checkout -q --orphan vwap-state
          cp ../alerts/vwap_alerts_state.json .
          git add vwap_alerts_state.json
          git commit -qm "VWAP alert state $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf origin vwap-state

      - name: Start next run
        if: success() && steps.scan.outputs.live == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run vwap-alerts.yml --repo "${{ github.repository }}" --ref main
